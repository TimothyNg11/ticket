# Traefik as the ingress controller on kind.
deployment:
  replicas: 1
# One node has the host ports, so a new pod can't start beside the old one:
# stop the old pod first.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
nodeSelector:
  ingress-ready: "true"
tolerations:
  - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  type: ClusterIP
providers:
  kubernetesIngress:
    enabled: true
    # kind has no load balancer, so nothing would fill in the Ingress address and
    # Argo CD would report the app Progressing forever. Traffic arrives on the
    # node's host ports, so publish localhost.
    ingressEndpoint:
      ip: 127.0.0.1
    publishedService:
      enabled: false # would take precedence and copy the Service's (empty) address
  kubernetesCRD:
    enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
