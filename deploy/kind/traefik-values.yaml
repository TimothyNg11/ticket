# Traefik as the ingress controller on kind.
deployment:
  replicas: 1
nodeSelector:
  ingress-ready: "true"
tolerations:
  - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  type: ClusterIP
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
