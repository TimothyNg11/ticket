# Local Kubernetes cluster for the ticketing system: one control plane and two
# workers. The ingress controller is reachable on host ports 18080 (HTTP) and
# 18443 (HTTPS): 80/443 are often taken on developer machines (IIS, WSL relays).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ticket
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 18080, protocol: TCP }
      - { containerPort: 443, hostPort: 18443, protocol: TCP }
  - role: worker
  - role: worker
networking:
  # Calico enforces NetworkPolicies; kind's default CNI (kindnet) does too as of
  # kind 0.24+, so the default is kept.
  disableDefaultCNI: false
