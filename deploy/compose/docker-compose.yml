# Local stack. Run from the repo root:
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml up --build
name: ticket

x-api-image: &api-image
  image: ticket/api:dev
  build:
    context: ../..
    dockerfile: services/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ticket
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs migrations once and exits; the API starts only after it succeeds.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://ticket:${POSTGRES_PASSWORD}@postgres:5432/ticket?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api-image
    environment:
      DATABASE_URL: postgres://ticket:${POSTGRES_PASSWORD}@postgres:5432/ticket?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata: {}
