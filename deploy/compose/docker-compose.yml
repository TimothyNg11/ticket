# Local stack. Run from the repo root:
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml up --build
name: ticket

x-db-url: &db-url postgres://ticket:${POSTGRES_PASSWORD}@postgres:5432/ticket?sslmode=disable

x-api-image: &api-image
  image: ticket/api:dev
  build: { context: ../.., args: { SERVICE: api } }

x-workers-image: &workers-image
  image: ticket/workers:dev
  build: { context: ../.., args: { SERVICE: workers } }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ticket
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs migrations once and exits; everything else starts after it succeeds.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  payments:
    image: ticket/payments-mock:dev
    build: { context: ../.., args: { SERVICE: payments_mock } }
    environment:
      DECLINE_RATE: ${PAYMENTS_DECLINE_RATE:-0}
      ERROR_RATE: ${PAYMENTS_ERROR_RATE:-0}
      LATENCY_MS: ${PAYMENTS_LATENCY_MS:-50}
    ports: ["8081:8081"]

  api:
    <<: *api-image
    environment:
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TICKET_SIGNING_KEY: ${TICKET_SIGNING_KEY:?set TICKET_SIGNING_KEY in .env}
      PAYMENTS_URL: http://payments:8081
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_SCALE: ${RATE_LIMIT_SCALE:-1}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      HOLD_TTL: ${HOLD_TTL:-10m}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      payments: { condition: service_started }
      redis: { condition: service_healthy }

  sweeper:
    <<: *workers-image
    command: ["sweeper"]
    environment:
      DATABASE_URL: *db-url
      SWEEP_INTERVAL: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

  availability:
    <<: *workers-image
    command: ["availability"]
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  admitter:
    <<: *workers-image
    command: ["admitter"]
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata: {}
