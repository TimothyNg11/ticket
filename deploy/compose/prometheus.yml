global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: workers
    static_configs:
      - targets:
          - sweeper:9090
          - availability:9090
          - admitter:9090
          - reconciler:9090
          - outbox-relay:9090
          - notifier:9090
          - invariants:9090
