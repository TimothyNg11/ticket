# Unit tests for the alert rules: promtool test rules deploy/observability/alerts_test.yaml
# Each test feeds synthetic series and asserts which alerts fire, so a typo in an
# expression is caught in CI rather than during an incident.
rule_files:
  - ../helm/ticket/files/alerts.yaml

evaluation_interval: 1m

tests:
  - name: invariant violation pages immediately
    interval: 1m
    input_series:
      - series: 'ticket_invariant_violations{check="seats_with_multiple_valid_tickets"}'
        values: "0 0 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: TicketInvariantViolated
        exp_alerts: []
      - eval_time: 2m
        alertname: TicketInvariantViolated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Core guarantee violated: 1 rows (double-sold seat or money/seat mismatch)"
              description: "Stop sales and investigate immediately. GET /v1/admin/invariants shows which check."

  - name: error rate over 1% for 5 minutes
    interval: 1m
    input_series:
      - series: 'ticket_http_requests_total{route="/v1/events/{id}/holds",method="POST",status="201"}'
        values: "0+100x15"
      - series: 'ticket_http_requests_total{route="/v1/events/{id}/holds",method="POST",status="503"}'
        values: "0+5x15"
    alert_rule_test:
      - eval_time: 3m
        alertname: TicketHighErrorRate
        exp_alerts: []
      - eval_time: 12m
        alertname: TicketHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "4.762% of API requests are failing"

  - name: outbox lag
    interval: 1m
    input_series:
      - series: "ticket_outbox_lag_seconds"
        values: "0 120 180 240 300 360 420 480"
    alert_rule_test:
      - eval_time: 3m
        alertname: TicketOutboxLagGrowing
        exp_alerts: []
      - eval_time: 7m
        alertname: TicketOutboxLagGrowing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Oldest unpublished event is 8m 0s old"
              description: "The outbox relay is down or behind. Notifications are delayed; nothing is lost."
