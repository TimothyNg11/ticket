name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.14.0 }

  generated:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: 1.30.0 }
      - run: sqlc generate
      - run: go generate ./internal/httpapi
      - name: fail if regeneration changed anything
        run: git diff --exit-code -- internal/db/sqlc internal/httpapi/gen

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      # Integration tests start real Postgres containers through Testcontainers,
      # using the runner's Docker daemon.
      - name: unit + integration tests (race detector on)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### Coverage: $(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.out }

  vuln-scan:
    name: dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, workers, payments_mock]
    steps:
      - uses: actions/checkout@v5
      - name: image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ticket-${{ matrix.service }}" | tr '_' '-' >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: scan image (fail on critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"

  smoke:
    name: compose smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: generate throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "TICKET_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_EMAILS=admin@example.com"
          } > .env
      - name: start stack
        run: |
          docker compose --env-file .env -f deploy/compose/docker-compose.yml up --build -d
          for i in $(seq 120); do curl -fs localhost:8080/readyz && exit 0; sleep 1; done
          exit 1
      - name: smoke test
        run: go run ./tools/smoke
      - name: logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/docker-compose.yml logs --no-color

  k8s-validate:
    name: helm chart and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: helm lint (local and cloud values)
        run: |
          helm lint deploy/helm/ticket -f deploy/helm/ticket/values-local.yaml
          helm lint deploy/helm/ticket -f deploy/helm/ticket/values-cloud.yaml
      - name: alert rules unit tests (promtool)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/deploy/observability --entrypoint promtool             prom/prometheus:v3.6.0 test rules alerts_test.yaml
      - name: dashboard is generated from its source
        run: |
          python3 deploy/observability/gen_dashboard.py
          git diff --exit-code -- deploy/helm/ticket/files/onsale-dashboard.json
      - name: promote script test
        run: bash .github/scripts/promote_test.sh
      - name: kubeconform (schema-validate rendered manifests)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for v in local cloud; do
            helm template ticket deploy/helm/ticket -f deploy/helm/ticket/values-$v.yaml \
              | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.34.0
          done

  kind-e2e:
    name: kind end-to-end (smoke + 60s flash sale with pod kills)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - name: bring up the cluster and deploy
        run: deploy/kind/up.sh
      - name: smoke test through the ingress
        run: BASE_URL=http://localhost:18080 go run ./tools/smoke
      - name: 60-second flash sale, deleting an API pod every 15s
        run: deploy/kind/kill-api-during-sale.sh 60
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n ticket get pods -o wide
          kubectl -n ticket get events --sort-by=.lastTimestamp | tail -40
          kubectl -n ticket logs deploy/api --tail=100 --all-containers

  promote:
    name: promote to gitops
    # Only builds that passed every check get deployed.
    needs: [build, smoke, kind-e2e, vuln-scan, k8s-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        # Full history: promote.sh checks the pinned build against this one.
        with: { ref: gitops, fetch-depth: 0 }
      - name: point the kind environment at this build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "${GITHUB_SHA}:.github/scripts/promote.sh" > "${RUNNER_TEMP}/promote.sh"
          bash "${RUNNER_TEMP}/promote.sh" "${GITHUB_SHA}"

